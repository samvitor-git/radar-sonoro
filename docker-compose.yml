# O Radar Sonoro roda atrás de um proxy Caddy que já existe no servidor.
# O app entra na rede desse proxy com o nome radarsonoro-app.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./data:/data
    networks:
      proxy:
        aliases:
          - radarsonoro-app

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-meu-dia_frontend}
