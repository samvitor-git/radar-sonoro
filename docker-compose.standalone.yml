# Para um servidor sem proxy: o Radar Sonoro com o próprio Caddy nas portas 80 e 443.
# Uso: docker compose -f docker-compose.standalone.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.standalone:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
